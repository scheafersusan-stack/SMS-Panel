# Panel API (SPEC §4.3) — OpenAPI 3.1. Component schemas of the six panel models mirror
# smsguard.core.models.ingest (checked by tests/unit/test_api_docs.py); edit both together.
openapi: 3.1.0
info:
  title: sms-guard panel API
  version: 1.0.0
  description: |
    Panel → sms-guard ingest contract (SPEC §4.3; ADR 0017, ADR 0018; OPEN_QUESTIONS A1-A8, D5, D10).

    All bodies are JSON (UTF-8); every timestamp is ISO-8601 with an offset and is emitted in UTC.
    The outbound decision callback (sms-guard → panel) is documented in `docs/api/panel-callback.md`.

    ## Authentication and signing

    Every `/api/v1/messages*` request carries:

    - `Authorization: Bearer <api_key>` (format `sg_<key_id>_<secret>`, exactly one header);
    - `X-Guard-Timestamp: <unix epoch seconds>` — canonical decimal (`^[1-9][0-9]{0,19}$`),
      within ±300 s of server time;
    - `X-Guard-Signature: hmac-sha256=<64 hex>` where the digest is
      `HMAC_SHA256(key = ASCII bytes of the inbound secret, msg = timestamp + "." + raw_body)`;
      `raw_body` is the exact bytes sent (a GET signs `"<timestamp>."`). Hex is lowercase on
      output and accepted in either case; comparison is constant-time; exactly one header.
    - `Idempotency-Key` (POST /messages only): 1-255 visible ASCII characters.
    - `Content-Type: application/json` on POST; `Content-Encoding` must be absent or `identity`.

    Check order: maintenance (503) → body ≤ 64 KiB (413) → content type (415) → API key (401) →
    timestamp (403) → signature (403) → replay cache (403) → rate limit (429) → syntax (400) →
    validation (422) → conflicts (409).

    ## Idempotency

    Same `Idempotency-Key` + same request fingerprint (sha256 of the canonical JSON of the
    validated request, so key order and whitespace do not matter) → the original `202` body
    replayed with `Idempotent-Replayed: true`. Same key + different fingerprint → `409
    IDEMPOTENCY_KEY_REUSED`; same `message_id` under another key → `409
    MESSAGE_ID_ALREADY_REGISTERED`.

    ## Rate limiting

    Token bucket per client: ingest scope = `api_clients.rate_limit` requests/minute (default
    600), read scope (poll, cancel) = 10 × that. Every authenticated response carries
    `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset`; `429` adds `Retry-After`.

    ## Errors

    Every error body is `ErrorResponse` (`{error_code, message, details, request_id}`) with
    `Cache-Control: no-store` and `X-Request-Id`. The complete `error_code` catalogue
    (also machine-readable in `x-error-codes`):

    | error_code | HTTP | Meaning |
    |---|---|---|
    | `MISSING_IDEMPOTENCY_KEY` | 400 | Idempotency-Key header is absent. |
    | `INVALID_IDEMPOTENCY_KEY` | 400 | Idempotency-Key repeated or not 1-255 visible ASCII characters. |
    | `UNSUPPORTED_CONTENT_ENCODING` | 400 | Content-Encoding other than identity. |
    | `MALFORMED_JSON` | 400 | Body is not valid UTF-8 JSON. |
    | `INVALID_API_KEY` | 401 | Authorization missing, repeated, malformed, unknown, inactive or past its rotation grace. |
    | `TIMESTAMP_INVALID` | 403 | X-Guard-Timestamp missing, repeated or not a canonical decimal integer. |
    | `TIMESTAMP_OUT_OF_WINDOW` | 403 | X-Guard-Timestamp more than 300 s from server time. |
    | `SIGNATURE_INVALID` | 403 | X-Guard-Signature missing, repeated, malformed or not matching (one message whatever the cause). |
    | `REPLAY_DETECTED` | 403 | The signature was already used for a different method/path. |
    | `NOT_FOUND` | 404 | Unknown route, or a guard_id that does not exist for this client. |
    | `METHOD_NOT_ALLOWED` | 405 | Method not supported on this route. |
    | `IDEMPOTENCY_KEY_REUSED` | 409 | Same Idempotency-Key with a different request fingerprint; details carry guard_id, status, poll_url. |
    | `MESSAGE_ID_ALREADY_REGISTERED` | 409 | message_id already registered under another Idempotency-Key; details carry guard_id, status, poll_url. |
    | `ALREADY_FINAL` | 409 | Cancel of a message whose final decision was already made. |
    | `OUTBOX_NOT_RETRYABLE` | 409 | Dev-only (SMSGUARD_ENV=dev) manual retry seam, not a panel route: the outbox event is not DEAD or RETRY. |
    | `PAYLOAD_TOO_LARGE` | 413 | Body larger than 64 KiB. |
    | `UNSUPPORTED_MEDIA_TYPE` | 415 | Content-Type is not application/json (POST). |
    | `VALIDATION_FAILED` | 422 | Field validation failed; details.errors[] lists {field, code, message} (codes include CALLBACK_URL_NOT_ALLOWED). |
    | `GUARD_ID_MISMATCH` | 422 | Cancel body guard_id differs from the path guard_id. |
    | `RATE_LIMITED` | 429 | Token bucket empty; Retry-After gives the wait in seconds. |
    | `INTERNAL_ERROR` | 500 | Unexpected server error (no details). |
    | `MAINTENANCE_MODE` | 503 | SMSGUARD_MAINTENANCE_MODE is on; Retry-After: 60. |
    | `SERVICE_UNAVAILABLE` | 503 | A backing service (database, Redis replay cache or rate limiter) is unavailable; fail-closed. |
    | `CREDENTIALS_UNAVAILABLE` | 503 | The client's stored secret cannot be decrypted (ADR 0019). |
servers:
- url: https://guard.internal.example
  description: behind the Caddy reverse proxy
security:
- panelApiKey: []
paths:
  /api/v1/messages:
    post:
      operationId: submitMessage
      summary: Submit a message for checking before it is sent
      description: Stores the message as PENDING and returns 202 immediately. The verdict arrives by callback
        (panel-callback.md) or by polling. The panel sends the SMS only after a final ALLOW.
      security:
      - panelApiKey: []
      parameters:
      - $ref: '#/components/parameters/XGuardTimestamp'
      - $ref: '#/components/parameters/XGuardSignature'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
      responses:
        '202':
          description: Accepted (or an idempotent replay of the original 202).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestAccepted'
        '400':
          description: 'error_code: `MISSING_IDEMPOTENCY_KEY`, `INVALID_IDEMPOTENCY_KEY`, `UNSUPPORTED_CONTENT_ENCODING`,
            `MALFORMED_JSON`.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'error_code: `INVALID_API_KEY`.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'error_code: `TIMESTAMP_INVALID`, `TIMESTAMP_OUT_OF_WINDOW`, `SIGNATURE_INVALID`,
            `REPLAY_DETECTED`.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'error_code: `IDEMPOTENCY_KEY_REUSED`, `MESSAGE_ID_ALREADY_REGISTERED`. details
            carry the existing guard_id, status, poll_url.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: 'error_code: `PAYLOAD_TOO_LARGE`.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: 'error_code: `UNSUPPORTED_MEDIA_TYPE`.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'error_code: `VALIDATION_FAILED`.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'error_code: `RATE_LIMITED`.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 'error_code: `MAINTENANCE_MODE`, `SERVICE_UNAVAILABLE`, `CREDENTIALS_UNAVAILABLE`.
            Fail-closed: the panel must treat the message as not sent.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/messages/{guard_id}:
    get:
      operationId: pollMessage
      summary: Status and result (polling)
      description: The latest DecisionEvent (same structure as the callback body) plus status, cancellation,
        callback deliveries and timeline. All keys are always present (null or [] when empty). Signs the
        empty body.
      security:
      - panelApiKey: []
      parameters:
      - $ref: '#/components/parameters/GuardId'
      - $ref: '#/components/parameters/XGuardTimestamp'
      - $ref: '#/components/parameters/XGuardSignature'
      - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Current state of the message.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePollResponse'
        '401':
          description: 'error_code: `INVALID_API_KEY`.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'error_code: `TIMESTAMP_INVALID`, `TIMESTAMP_OUT_OF_WINDOW`, `SIGNATURE_INVALID`.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'error_code: `NOT_FOUND`.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'error_code: `RATE_LIMITED`.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 'error_code: `MAINTENANCE_MODE`, `SERVICE_UNAVAILABLE`, `CREDENTIALS_UNAVAILABLE`.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/messages/{guard_id}/cancel:
    post:
      operationId: cancelMessage
      summary: Cancel a pending or under-review message
      description: Allowed from PENDING and UNDER_REVIEW; repeating it returns the same 200. No callback
        is sent for a cancellation. The body guard_id must equal the path.
      security:
      - panelApiKey: []
      parameters:
      - $ref: '#/components/parameters/GuardId'
      - $ref: '#/components/parameters/XGuardTimestamp'
      - $ref: '#/components/parameters/XGuardSignature'
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      responses:
        '200':
          description: Cancelled (or already cancelled).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
        '400':
          description: 'error_code: `UNSUPPORTED_CONTENT_ENCODING`, `MALFORMED_JSON`.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'error_code: `INVALID_API_KEY`.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'error_code: `TIMESTAMP_INVALID`, `TIMESTAMP_OUT_OF_WINDOW`, `SIGNATURE_INVALID`,
            `REPLAY_DETECTED`.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'error_code: `NOT_FOUND`.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
