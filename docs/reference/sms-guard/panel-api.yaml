              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/ready:
    get:
      operationId: ready
      summary: Readiness
      security: []
      description: 200 only when db, redis and queue are ok; LLM/sandbox state is reported but never gates
        readiness (fail-closed path exists).
      responses:
        '200':
          description: Ready.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
