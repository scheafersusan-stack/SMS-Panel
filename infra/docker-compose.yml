name: payamakyar

# Dev stack:  make dev   (= docker compose -f infra/docker-compose.yml up --build)
# Settings come from infra/.env: copy infra/env/.env.example first (required). Secrets have no
# defaults in this file, so a missing one stops compose instead of booting with a known key.
# Only caddy publishes ports. The api trusts X-Forwarded-For only from the `edge` subnet.

x-api-build: &api-build
  context: ..
  dockerfile: apps/panel-api/Dockerfile

x-api-env: &api-env
  PAYAMAKYAR_ENV: ${PAYAMAKYAR_ENV:-dev}
  PAYAMAKYAR_LOG_LEVEL: ${PAYAMAKYAR_LOG_LEVEL:-INFO}
  PAYAMAKYAR_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-payamakyar}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}@postgres:5432/${POSTGRES_DB:-payamakyar}
  PAYAMAKYAR_REDIS_URL: redis://redis:6379/0
  PAYAMAKYAR_SECRET_KEY: ${PAYAMAKYAR_SECRET_KEY:?set PAYAMAKYAR_SECRET_KEY in infra/.env}
  PAYAMAKYAR_PUBLIC_BASE_URL: ${PAYAMAKYAR_PUBLIC_BASE_URL:-https://localhost:8443}
  PAYAMAKYAR_TRUSTED_PROXIES: ${PAYAMAKYAR_TRUSTED_PROXIES:-172.28.0.0/24}
  PAYAMAKYAR_WORKER_POLL_SECONDS: ${PAYAMAKYAR_WORKER_POLL_SECONDS:-1.0}

x-hardening: &hardening
  restart: unless-stopped
  init: true
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    <<: *hardening
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payamakyar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-payamakyar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [edge]

  redis:
    <<: *hardening
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [edge]

  # One-shot: alembic upgrade head. api and worker wait for it to finish successfully.
  migrate:
    build: *api-build
    image: payamakyar/panel-api:dev
    command: ["python", "-m", "payamakyar.api", "migrate"]
    environment: *api-env
    restart: "no"
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [edge]

  api:
    <<: *hardening
    build: *api-build
    image: payamakyar/panel-api:dev
    command: ["python", "-m", "payamakyar.api", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment: *api-env
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/panel/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [edge]

  worker:
    <<: *hardening
    build: *api-build
    image: payamakyar/panel-api:dev
    command: ["python", "-m", "payamakyar.api", "worker"]
    environment: *api-env
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    networks: [edge]

  caddy:
    <<: *hardening
    build:
      context: ..
      dockerfile: infra/caddy.Dockerfile
    image: payamakyar/edge:dev
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      PAYAMAKYAR_SITE: ${PAYAMAKYAR_SITE:-localhost}
    ports:
      - "${PAYAMAKYAR_HTTP_PORT:-8080}:80"
      - "${PAYAMAKYAR_HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: {condition: service_healthy}
    networks: [edge]

# A fixed subnet lets PAYAMAKYAR_TRUSTED_PROXIES name exactly the compose network.
networks:
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  caddy_data:
  caddy_config:
