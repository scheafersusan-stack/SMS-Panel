[project]
name = "payamakyar-panel-core"
version = "0.1.0"
description = "Domain models, settings and security primitives for Payamakyar"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.14,<3", "pydantic-settings>=2.16,<3", "argon2-cffi>=25,<26", "pyotp>=2.9,<3", "cryptography>=50,<51", "tzdata>=2025.2,<2027"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "payamakyar.core"
