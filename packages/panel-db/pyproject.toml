[project]
name = "payamakyar-panel-db"
version = "0.1.0"
description = "Database models, sessions and migrations for Payamakyar"
requires-python = ">=3.12,<3.13"
dependencies = ["sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.32,<1", "alembic>=1.16,<2", "payamakyar-panel-core"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "payamakyar.db"
